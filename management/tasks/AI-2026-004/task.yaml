  - "buffer at most one Tool Call, reject unknown/multiple/incomplete Tool and validate final arguments as a JSON object against the request Draft 2020-12 Schema with external refs forbidden"
  - "propagate client cancellation to the Qwen stream, discard partial/late Tool arguments and emit only response.cancelled; no late normal terminal"
  - "use constant-time service Bearer auth, bounded active/recent provider_call_id registry, fail-closed readiness and sanitized errors/logs/metrics"
  - "add an isolated server/gateway/requirements.txt with exact FastAPI/Uvicorn/Pydantic/HTTPX/jsonschema/pytest versions; install only into existing local .venv"
  - "write RED then minimum GREEN for contracts, events/auth/registry, Qwen transport, Tool validation/service and FastAPI; use Fake Qwen Transport only, zero skip"
  - "run tests/model_service, compileall, selected existing unaffected tests, allowed-path/privacy scans and diff checks; do not call real Qwen, Node, Backend, App, Hardware or WebRTC"
  - "do not push, merge or deploy"
