  - "preserve the pre-existing untracked root .gitkeep and private config.yaml exactly; never open, parse, move, stage, ignore, delete or print them"
  - "use only process environment for private service/Qwen configuration; do not call dotenv, config.yaml, Backend config or existing VLM credential fallback"
