findings:
  - id: "P0-AI-2026-004-001"
    severity: "P0"
    title: "内部 Tool 名称不符合百炼 Function Calling 字符约束"
    files:
      - "server/gateway/qwen_transport.py:258"
      - "server/gateway/contracts.py:31"
    trigger: "任意携带 nomacook.speak@1 或 nomacook.submit_decision@1 的真实 Qwen3.6 Tool 请求。"
    impact: "当前 _payload 将内部合同名原样写入 function.name，其中包含点号和 @。百炼 OpenAI-compatible Function Calling 只允许字母、数字、下划线和短划线，真实供应商会在模型执行前拒绝请求，Agent Tool 主链无法开始。"
    contract: "CONTRACT-AI-MODEL-SERVICE-001 v1 第 5、7、13 节；内部合同名必须保持，但 Provider Adapter 必须做供应商安全映射。"
    evidence: "Manager 读取阿里云官方 Function Calling 字段约束，并以当前 _payload 最小检查确认实际发送 nomacook.speak@1；未调用真实模型。"
  - id: "P0-AI-2026-004-002"
    severity: "P0"
    title: "官方 finish_reason 后的 usage 尾块被误判为非法 stop 后事件"
    files:
      - "server/gateway/qwen_transport.py:151"
      - "server/gateway/qwen_transport.py:209"
      - "server/gateway/service.py:31"
    trigger: "Qwen 使用 stream=true 与 stream_options.include_usage=true，先返回带 finish_reason 的 choice chunk，再返回 choices=[] 的最终 usage chunk，最后 [DONE]。"
    impact: "Transport 先 yield stop，随后 yield usage；AgentModelService 在 stop_reason 非空后拒绝任何后续 chunk，因此每次符合官方顺序的正常文本或 Tool 响应都会变成 response.failed/MODEL_RESPONSE_INVALID。"
    contract: "CONTRACT-AI-MODEL-SERVICE-001 v1 第 4、6、7、13 节；usage 与正常唯一终态必须按供应商流正确归一化。"
    evidence: "Manager 使用 Fake Transport 按官方 finish→usage 顺序复现，最终稳定输出 response.failed MODEL_RESPONSE_INVALID；现有测试使用了 usage→stop 的反向顺序。"
required_changes:
  - "在 Qwen Provider Adapter 内增加双向固定别名：例如 nomacook.speak@1 ↔ nomacook_speak_v1、nomacook.submit_decision@1 ↔ nomacook_submit_decision_v1。只向供应商发送安全别名；收到 Tool name 后严格反向映射回内部合同名，未知别名 fail-closed。不得修改正式合同内部名称。"
  - "按官方顺序规范化 finish/usage：Transport 暂存唯一 finish_reason，继续接受最终 usage-only chunk，在 [DONE] 前后完成一致性检查，最后只 yield 一次 stop；或实现等价的、可证明不会把合法尾部 usage 判错的顺序。"
  - "增加 RED/GREEN：检查供应商 payload 只含安全别名；供应商返回安全别名后服务输出内部 Tool 名；官方 text/tool 的 finish→usage→DONE 顺序均正常 message.end；多 finish、stop 后 text/tool、缺 DONE 或未知别名仍 fail-closed。"
