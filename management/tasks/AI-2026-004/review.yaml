residual_risks:
  - "P1 backlog: AgentModelService has a heartbeat method but does not run a concurrent heartbeat while Qwen is idle."
  - "P1 backlog: FastAPI reads the complete chunked request body before applying the 512 KiB post-read check when Content-Length is absent."
  - "P1 backlog: Qwen timeout uses deadline_at-started_at duration rather than remaining wall-clock time at provider admission."
  - "P1 backlog: shared httpx.AsyncClient is not closed through a FastAPI lifespan hook."
  - "P1 backlog: ServiceSettings clamps invalid numeric environment values and permits short service tokens/non-loopback plaintext host instead of rejecting configuration fail-closed."
  - "P1 backlog: Provider Tool Call id is not preserved in the provider-neutral tool.call event; Node currently creates a deterministic local fallback."
  - "P2 backlog: event timestamps default to the stream creation time unless an explicit heartbeat time is supplied."
  - "Real Node, Backend, Qwen, App, Hardware and WebRTC remain integration-pending."
